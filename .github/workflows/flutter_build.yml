name: Build Pepsi Runner APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. Flutter
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true


      # ==========================================================
      # 4. Verify environment
      # ==========================================================

      - name: Verify Flutter installation
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # ==========================================================
      # 5. Verify project
      # ==========================================================

      - name: Verify Pepsi Runner project
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib
          test -d assets
          test -d android

          test -f android/settings.gradle || \
          test -f android/settings.gradle.kts

          test -f android/app/build.gradle || \
          test -f android/app/build.gradle.kts

          test -f android/app/src/main/AndroidManifest.xml

          echo "Pepsi Runner project verified."


      # ==========================================================
      # 6. Create Android local.properties
      # ==========================================================

      - name: Create Android local.properties
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

          echo "Android local.properties created."


      # ==========================================================
      # 7. Generate Gradle Wrapper
      # ==========================================================
      #
      # The repository ignores:
      # gradlew
      # gradlew.bat
      # gradle-wrapper.jar
      #
      # They are generated inside GitHub Actions.
      #
      # IMPORTANT:
      # Do NOT delete android/.
      #

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          set -e

          gradle wrapper --gradle-version 8.4

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper generated successfully."

          ./gradlew --version


      # ==========================================================
      # 8. Flutter dependencies
      # ==========================================================

      - name: Flutter pub get
        run: flutter pub get


      # ==========================================================
      # 9. Confirm Unity Ads
      # ==========================================================

      - name: Confirm Unity Ads dependency
        run: |
          if flutter pub deps | grep -qi "unity_ads_plugin"; then
            echo "Unity Ads dependency found."
          else
            echo "WARNING: unity_ads_plugin was not found."
            echo "Check pubspec.yaml."
          fi


      # ==========================================================
      # 10. Decode release keystore
      # ==========================================================

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks

          echo "Release keystore decoded successfully."


      # ==========================================================
      # 11. Create key.properties
      # ==========================================================

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ==========================================================
      # 12. Flutter clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 13. Get dependencies again
      # ==========================================================

      - name: Flutter pub get after clean
        run: flutter pub get


      # ==========================================================
      # 14. Analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true


      # ==========================================================
      # 15. Tests
      # ==========================================================

      - name: Flutter test
        run: flutter test


      # ==========================================================
      # 16. Build Release APK
      # ==========================================================

      - name: Build Release APK
        run: flutter build apk --release


      # ==========================================================
      # 17. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -f "$APK"

          echo "=========================================="
          echo "  PEPSI RUNNER APK BUILT SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 18. Upload APK artifact
      # ==========================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pepsi-runner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30