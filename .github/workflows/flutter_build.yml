name: Build Pepsi Runner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. Java 17
      # ==========================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================================
      # 3. Flutter
      # ==========================================================

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true


      # ==========================================================
      # 4. Verify environment
      # ==========================================================

      - name: Verify Flutter installation
        run: |
          flutter --version
          dart --version
          flutter doctor -v


      # ==========================================================
      # 5. Verify Android project
      # ==========================================================

      - name: Verify Android project
        run: |
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Android project found."


      # ==========================================================
      # 6. Create local.properties for CI
      # ==========================================================

      - name: Create Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

          echo "===== local.properties ====="
          cat android/local.properties


      # ==========================================================
      # 7. Generate missing Gradle Wrapper
      # ==========================================================
      #
      # android/ remains committed.
      # Only the missing wrapper files are generated in CI.
      #

      - name: Generate Gradle Wrapper
        run: |
          set -e

          cd android

          gradle wrapper --gradle-version 8.4

          cd ..

          test -f android/gradlew
          test -f android/gradlew.bat
          test -f android/gradle/wrapper/gradle-wrapper.jar

          echo "Gradle Wrapper generated successfully."


      # ==========================================================
      # 8. Make gradlew executable
      # ==========================================================

      - name: Make Gradle Wrapper executable
        run: |
          chmod +x android/gradlew


      # ==========================================================
      # 9. Flutter dependencies
      # ==========================================================

      - name: Get Flutter dependencies
        run: flutter pub get


      # ==========================================================
      # 10. Confirm Unity Ads
      # ==========================================================

      - name: Confirm Unity Ads dependency
        run: |
          flutter pub deps | grep -i unity_ads_plugin || \
          echo "WARNING: unity_ads_plugin was not found."


      # ==========================================================
      # 11. Decode release keystore
      # ==========================================================

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/upload-keystore.jks

          test -f android/app/upload-keystore.jks

          echo "Release keystore created."


      # ==========================================================
      # 12. Create key.properties
      # ==========================================================

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "key.properties created."


      # ==========================================================
      # 13. Flutter clean
      # ==========================================================

      - name: Flutter clean
        run: flutter clean


      # ==========================================================
      # 14. Flutter pub get again
      # ==========================================================

      - name: Get dependencies after clean
        run: flutter pub get


      # ==========================================================
      # 15. Analyze
      # ==========================================================

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true


      # ==========================================================
      # 16. Tests
      # ==========================================================

      - name: Flutter test
        run: flutter test


      # ==========================================================
      # 17. Build Release APK
      # ==========================================================

      - name: Build Release APK
        run: flutter build apk --release


      # ==========================================================
      # 18. Verify APK
      # ==========================================================

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk

          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk


      # ==========================================================
      # 19. Upload APK
      # ==========================================================

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pepsi-runner-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30