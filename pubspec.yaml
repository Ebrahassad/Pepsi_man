name: pepsi_runner
description: "Pepsi Runner - Fast Arcade Lane Runner Game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  unity_ads_plugin: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/characters/runner/
    - assets/images/obstacles/
    - assets/images/items/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/worlds/
    - assets/audio/music/
    - assets/audio/sfx/